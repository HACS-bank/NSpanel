# Bluetooth Proxy with smart scanning (only when HA is connected)
bluetooth_proxy:

esp32_ble_tracker:
  scan_parameters:
    continuous: false
    active: true
    
api:
  on_client_connected:
    then:
      - esp32_ble_tracker.start_scan:
          continuous: true
  on_client_disconnected:
    then:
      - esp32_ble_tracker.stop_scan:
      